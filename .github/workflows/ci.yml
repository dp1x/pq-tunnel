name: CI

on:
  push:
    branches: [main]
  pull_request:

# Toolchain versions used below are pinned on purpose:
#   * stable  -> 1.99.0        (matches the repo's rust-toolchain.toml)
#   * MSRV    -> 1.85.0        (the floor declared in Cargo.toml)
#   * nightly -> nightly-2026-10-18 (matches fuzz/rust-toolchain.toml)
# A floating `stable`/`nightly` means two runs a month apart can use two
# different compilers, and a compiler change can silently change behaviour.
env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (clippy + tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Set up Rust (1.99.0, x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.99.0
          targets: x86_64-pc-windows-msvc

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings

      - name: Workspace tests
        run: cargo test --workspace --locked --target x86_64-pc-windows-msvc

      - name: E2E smoke (serialized)
        run: cargo test --locked --target x86_64-pc-windows-msvc --test e2e_smoke -- --test-threads=1

  linux:
    name: Linux (clippy + tests + fuzz smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Set up Rust 1.99.0
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.99.0

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Workspace tests
        run: cargo test --workspace --locked

      # ---- fuzz provenance -------------------------------------------
      # `fuzz/` is its own cargo workspace, so it resolves its own
      # dependency graph.  The two gates below make sure the code that is
      # fuzzed is the code that ships:
      #   1. `cargo metadata --locked` fails if fuzz/Cargo.lock is stale
      #      with respect to fuzz/Cargo.toml (the `--locked` guarantee
      #      cargo-fuzz itself cannot pass through).
      #   2. the lock comparison fails if any crate shared with the
      #      shipped workspace resolves to a different version there.
      - name: Fuzz lock is fresh and in sync with the shipped lock
        run: |
          cargo metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1 > /dev/null
          python3 - <<'PY'
          import re
          import sys

          def packages(path):
              versions = {}
              with open(path, encoding="utf-8") as handle:
                  for block in handle.read().split("[[package]]")[1:]:
                      name = re.search(r'name = "([^"]+)"', block)
                      version = re.search(r'version = "([^"]+)"', block)
                      if name and version:
                          versions.setdefault(name.group(1), set()).add(version.group(1))
              return versions

          shipped = packages("Cargo.lock")
          fuzzed = packages("fuzz/Cargo.lock")
          shared = set(shipped) & set(fuzzed)

          drift = [
              (name, sorted(shipped[name]), sorted(fuzzed[name]))
              for name in sorted(shared)
              if shipped[name] != fuzzed[name]
          ]

          if drift:
              print("fuzz/Cargo.lock has drifted from the shipped Cargo.lock:")
              for name, want, got in drift:
                  print(f"  {name}: shipped={want} fuzzed={got}")
              print()
              print("The fuzz workspace would exercise different code than the one that ships.")
              print("Fix: update the pins in fuzz/Cargo.toml, then re-resolve with")
              print("  cargo update --manifest-path fuzz/Cargo.toml")
              sys.exit(1)

          print(f"fuzz lock in sync: {len(shared)} shared packages match the shipped lock")
          print(f"fuzz-only packages (harness): {sorted(set(fuzzed) - set(shipped))}")
          PY

      - name: Set up nightly (cargo-fuzz)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-10-18

      - name: Install cargo-fuzz
        run: cargo +nightly-2026-10-18 install cargo-fuzz --locked

      - name: Fuzz build
        run: cargo +nightly-2026-10-18 fuzz build --fuzz-dir fuzz

      - name: Fuzz smoke (-runs=1000 per target)
        run: |
          for target in wire_packet_from_bytes inner_plaintext_decode \
                        envelope_decrypt replay_window handshake_message_decode \
                        handshake_driver_receive session_manager_receive \
                        cover_scheduler relay_overlay manager_churn; do
            cargo +nightly-2026-10-18 fuzz run "$target" --fuzz-dir fuzz -- -runs=1000
          done

  supply-chain:
    name: Supply chain (RustSec advisory audit)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Set up Rust 1.99.0
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.99.0

      # cargo-audit is pinned by version and built from its own published
      # lockfile, so the auditor itself is reproducible.  It is invoked
      # directly (rather than through a third-party GitHub Action) to keep
      # the number of moving parts in this pipeline small.
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      # A RustSec advisory against either dependency graph fails the build.
      # Yanked-but-not-vulnerable crates are reported as warnings only.
      - name: Audit the shipped lockfile
        run: cargo audit --file Cargo.lock

      - name: Audit the fuzz lockfile
        run: cargo audit --file fuzz/Cargo.lock

  msrv:
    name: MSRV 1.85 (check)
    runs-on: ubuntu-latest
    env:
      # RUSTUP_TOOLCHAIN takes precedence over the repository's
      # rust-toolchain.toml, so this job really does build with 1.85.0.
      RUSTUP_TOOLCHAIN: 1.85.0
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Set up Rust 1.85
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.85.0

      - name: cargo check (--locked)
        run: cargo check --workspace --locked --all-targets
