name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    name: Windows (clippy + tests)
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust (stable, x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --target x86_64-pc-windows-msvc -- -D warnings

      - name: Workspace tests
        run: cargo test --workspace --locked --target x86_64-pc-windows-msvc

      - name: E2E smoke (serialized)
        run: cargo test --locked --target x86_64-pc-windows-msvc --test e2e_smoke -- --test-threads=1

  linux:
    name: Linux (clippy + tests + fuzz smoke)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Workspace tests
        run: cargo test --workspace --locked

      - name: Set up nightly (cargo-fuzz)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked

      - name: Fuzz build
        run: cargo +nightly fuzz build --fuzz-dir fuzz

      - name: Fuzz smoke (-runs=1000 per target)
        run: |
          for target in wire_packet_from_bytes inner_plaintext_decode \
                        envelope_decrypt replay_window handshake_message_decode \
                        handshake_driver_receive session_manager_receive; do
            cargo +nightly fuzz run "$target" --fuzz-dir fuzz -- -runs=1000
          done

  msrv:
    name: MSRV 1.85 (check)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust 1.85
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0

      - name: cargo check (--locked)
        run: cargo check --workspace --locked --all-targets