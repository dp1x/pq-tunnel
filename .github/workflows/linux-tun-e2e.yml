name: Linux TUN E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux-tun-e2e:
    name: Linux TUN E2E (namespaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Set up Rust 1.99.0
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.99.0

      - name: Build pq-tunnel (tun)
        run: cargo build -p pq-tunnel-bin

      - name: Run real TUN E2E in network namespaces
        run: sudo bash scripts/linux_tun_e2e.sh ./target/debug/pq-tunnel