[package]
name = "pq-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ml-kem = { version = "0.3.2", features = ["getrandom", "zeroize"] }
ml-dsa = { version = "0.1.1", features = ["getrandom", "zeroize"] }
x25519-dalek = { version = "=3.0.0-rc.1", features = ["getrandom", "static_secrets"] }
sha2 = { version = "0.10", features = ["force-soft-compact"] }
thiserror.workspace = true
zeroize = { version = "1", features = ["derive"] }
hybrid-array = "0.4"
signature = "3"
kem = "0.3"
curve25519-dalek = { version = "=5.0.0-rc.1", features = ["rand_core"] }
typenum = "1"
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
getrandom = "0.3"
